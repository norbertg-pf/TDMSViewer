[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdmsviewer"
version = "1.0.0"
description = "Fast, read-only viewer for NI TDMS files (replaces the NI TDMS File Viewer on Ubuntu)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "npTDMS>=1.9",
    "PySide6>=6.5",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-qt>=4"]

[project.scripts]
tdmsviewer = "tdmsviewer.app:main"

[tool.setuptools.packages.find]
include = ["tdmsviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
