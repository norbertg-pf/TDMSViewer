[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdmsviewer"
version = "1.0.0"
description = "Fast, read-only viewer for NI TDMS files (replaces the NI TDMS File Viewer on Ubuntu)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [  # tested ranges, see requirements.txt
    "numpy>=1.26,<3",
    "npTDMS>=1.11,<1.12",
    "PySide6>=6.8,<7",
    "pyqtgraph>=0.13.7,<0.15",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-qt>=4"]

[project.scripts]
tdmsviewer = "tdmsviewer.app:main"

[tool.setuptools.packages.find]
include = ["tdmsviewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.setuptools.package-data]
tdmsviewer = ["*.svg"]
